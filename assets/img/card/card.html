<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:800px;overflow:hidden}
  body{position:relative;background:radial-gradient(120% 90% at 50% 18%,#F7F9FB 0%,#EEF2F5 55%,#E3E9EE 100%);font-family:"Schibsted Grotesk","Segoe UI",sans-serif;color:#0A1722}
  .ring{position:absolute;left:50%;top:50%;width:760px;height:760px;translate:-50% -47%;opacity:.16}
  .phones{position:absolute;left:50%;top:40px;display:flex;align-items:flex-start;translate:-50% 0}
  .device{width:var(--w);padding:calc(var(--w)*.028);border-radius:calc(var(--w)*.15);background:#0A1722;box-shadow:inset 0 0 0 2px #2D3F4D,0 50px 80px -36px rgba(10,23,34,.55),0 14px 28px -14px rgba(10,23,34,.3)}
  .device img{display:block;width:100%;border-radius:calc(var(--w)*.125)}
  .back{--w:252px}
  .front{--w:274px;margin:58px 0 0 -50px}
</style></head><body>
<div class="phones">
  <div class="device back"><img src="../app/home.png"></div>
  <div class="device front"><img src="../app/results.png"></div>
</div>
</body></html>
